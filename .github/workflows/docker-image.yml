name: Build and push image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * *"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only relevant for the nightly run: rebuild when the upstream Jenkins
      # image has moved. Pushes and manual runs always build, otherwise merged
      # Dockerfile changes would never get published.
      - name: Check if base image updated
        id: check
        if: github.event_name == 'schedule'
        uses: lucacome/docker-image-update-checker@v3.1.1
        with:
          base-image: jenkins/jenkins:jdk21
          image: synec/docker-jenkins:latest
          platforms: linux/amd64

      - name: Decide whether to build
        id: decide
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "Event is ${{ github.event_name }}: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.check.outputs.needs-updating }}" == "true" ]]; then
            echo "Base image changed: building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduled run and base image unchanged: skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: synec/docker-jenkins:latest
